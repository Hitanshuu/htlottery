name: Pick 3 predict + reconcile

on:
  schedule:
    # 14:45 UTC = 18:45 Asia/Dubai -- predict: generate/upsert tonight's pick.
    # GitHub Actions scheduled cron is best-effort and has been observed
    # drifting 15-45+ min late, so this fires 45 min ahead of the 19:30
    # target to guarantee the pick lands well before the 20:30 ticket-buying
    # window, ~50min before the 21:30 draw.
    - cron: "45 14 * * *"
    # 18:00 UTC = 22:00 Asia/Dubai -- reconcile: pull the landed 21:30 result
    # and settle today's prediction / P&L. Never touches the pick. Fired 30
    # min ahead of the 22:30 target for the same drift-buffer reason.
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Which run to trigger manually"
        type: choice
        options: [predict, reconcile]
        default: predict

permissions:
  contents: write

concurrency:
  group: daily-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Determine mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "45 14 * * *" ]; then
            echo "mode=predict" >> "$GITHUB_OUTPUT"
          else
            echo "mode=reconcile" >> "$GITHUB_OUTPUT"
          fi

      - name: Run pipeline
        run: python run_daily.py --mode "${{ steps.mode.outputs.mode }}"

      - name: Commit and push updated data/docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ docs/
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "${{ steps.mode.outputs.mode }} run: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "${GITHUB_REF_NAME}"
